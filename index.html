<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <title>pwareact</title>
</head>

<body>
  <!-- Fallback Loading Screen for Slow/Legacy Devices -->
  <div id="root">
    <div
      style="display:flex;justify-content:center;align-items:center;height:100vh;background:#000;color:#0ff;font-family:monospace;flex-direction:column;">
      <h1>INITIALIZING SYSTEM...</h1>
      <p>If this screen persists, update client browser.</p>
    </div>
  </div>

  <!-- Global Error Trap for TV Debugging -->
  <div id="debug-console"
    style="display:none; position:fixed; bottom:0; left:0; right:0; height:150px; background:rgba(255,0,0,0.8); color:white; overflow:auto; padding:10px; font-family:monospace; z-index:9999; font-size:12px;">
  </div>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      var consoleDiv = document.getElementById('debug-console');
      if (consoleDiv) {
        consoleDiv.style.display = 'block';
        consoleDiv.innerHTML += '<p style="margin:2px 0; border-bottom:1px solid #444;">[ERR] ' + msg + ' <br><small>' + url + ':' + line + '</small></p>';
      }
    };

    window.addEventListener('unhandledrejection', function (event) {
      var consoleDiv = document.getElementById('debug-console');
      if (consoleDiv) {
        consoleDiv.style.display = 'block';
        consoleDiv.innerHTML += '<p style="margin:2px 0; border-bottom:1px solid #444;">[PROMISE] ' + event.reason + '</p>';
      }
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
